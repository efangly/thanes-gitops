apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thanes-lims-api
  namespace: thanes-lims
spec:
  parentRefs:
    - name: lims-gateway
      sectionName: https
  hostnames:
    - lims.siamatic.work
  rules:
    # Matched before the general /api/v1 prefix rule below (more specific
    # PathPrefix wins under Gateway API rule-precedence, but naming this
    # rule also lets BackendTrafficPolicy target it independently via
    # sectionName - see 07-backend-traffic-policy.yaml).
    - name: stream
      matches:
        - path:
            type: PathPrefix
            value: /api/v1/partner-devices/stream
      backendRefs:
        - name: thanes-lims-api
          port: 80
    - name: default
      matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: thanes-lims-api
          port: 80
