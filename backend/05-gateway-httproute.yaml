apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thanes-lims-api
  namespace: thanes-lims
spec:
  parentRefs:
    - name: lims-gateway
      sectionName: https
  hostnames:
    - lims.siamatic.work
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: thanes-lims-api
          port: 80
