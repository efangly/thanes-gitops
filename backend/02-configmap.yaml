apiVersion: v1
kind: ConfigMap
metadata:
  name: thanes-lims-config
  namespace: thanes-lims
data:
  APP_ENV: "production"
  APP_PORT: "8080"
  # DB already has data on an existing OCI VM; migrations are managed
  # out-of-band, not on pod start.
  AUTO_MIGRATE: "false"

  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_TTL: "168h"

  # Refresh Cookie (see backend docs/adr/0004-refresh-token-in-httponly-cookie.md).
  # true because the Gateway's https listener (lims-tls) terminates TLS in
  # front of this Service - the API itself always sees plain http, but the
  # browser only ever talks to it over https.
  COOKIE_SECURE: "true"
  CORS_ALLOW_ORIGINS: "https://lims.siamatic.work"
  # CORS_ALLOW_ORIGINS is deliberately NOT set here: frontend and API share
  # the same hostname (lims.siamatic.work), split only by path prefix (see
  # 05-gateway-httproute.yaml) - same-origin requests never hit CORS at all.
  # Only add this var if a deployment ever splits them onto different
  # origins/subdomains.

  # Object storage (documents) - OCI Object Storage via its S3-compatible API
  # (see backend docs/adr/0009-oci-object-storage-via-s3-compat.md).
  # STORAGE_ENDPOINT = <namespace>.compat.objectstorage.<region>.oraclecloud.com
  # STORAGE_REGION must be the OCI region id - it's part of the SigV4 signature.
  # Credentials STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY (an IAM user's Customer
  # Secret Key) live in the thanes-lims-secrets Secret, not here.
  # OC43 realm -> domain is oci.thaiaiscloud.com, not oraclecloud.com.
  STORAGE_ENDPOINT: "ax45vpor5h7p.compat.objectstorage.ap-samutprakan-1.oci.thaiaiscloud.com"
  STORAGE_REGION: "ap-samutprakan-1"
  STORAGE_BUCKET: "lims-bucket"
  STORAGE_USE_SSL: "true"

  LOG_LEVEL: "info"

  AUTO_REORDER_ENABLED: "true"
  AUTO_REORDER_INTERVAL: "1h"

  # MCP server (cmd/mcp-server, ../mcp-server/ Deployment) - separate process/
  # image entrypoint from the API, exposing read-only LIMS tools over MCP
  # Streamable HTTP for lims-chatbot-service (see backend
  # docs/mcp-server-tools.md, docs/adr/0013-mcp-server-transport.md). Reads
  # this same DATABASE_URL directly - no Oracle involved. The mcp-server
  # Deployment reuses this ConfigMap (envFrom) rather than having its own,
  # since it shares the same Go Config struct as the API and therefore needs
  # every var here too (Storage/Redis/Partner vars included, even though it
  # doesn't use them - internal/config/config.go marks them `required`).
  MCP_SERVER_PORT: "8090"

  # Partner Device (SMtrack third-party device data via gRPC - see backend
  # docs/partner-api-guide.md, docs/adr/0012-partner-api-grpc-transport.md).
  # PARTNER_GRPC_ADDR is a bare host:port gRPC dial target, not a URL - no
  # http(s):// scheme. Plaintext (no TLS) for now, a known gap on SMtrack's
  # side (see ADR 0012). PARTNER_API_KEY lives in thanes-lims-secrets, not
  # here (see 06-external-secret.yaml + SECRETS-OCI-VAULT.md).
  PARTNER_API_ENABLED: "true"
  PARTNER_GRPC_ADDR: "siamatic.thddns.net:50051"
  PARTNER_API_POLL_INTERVAL: "30s"
  PARTNER_API_CACHE_TTL: "45s"
  PARTNER_API_STALE_MAX: "5m"
