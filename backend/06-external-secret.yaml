# Syncs thanes-lims-secrets from OCI Vault via External Secrets Operator (ESO).
# ESO must already be installed in the cluster and worker nodes must be able to
# read the vault via Instance Principal - see SECRETS-OCI-VAULT.md.
#
# ArgoCD manages these two objects; the resulting Secret carries no data in git.
#
# apiVersion: external-secrets.io/v1 is served by ESO >= v0.14. On older
# operators use external-secrets.io/v1beta1 (same field layout).
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: oci-vault-thanes-lims
spec:
  provider:
    oracle:
      region: ap-samutprakan-1
      # thanes-lims-backend-vault
      vault: ocid1.vault.oc43.ap-samutprakan-1.rfvitu3faaa2k.abrgqljr6coo3adcn3ajyumrdhal77acv6ny2pjjs46vbejh5tro4a4ioybq
      compartment: ocid1.compartment.oc43..aaaaaaaacykfvbprbe7kiwqs3ingrgumelfcsvuxfzdgg2uujlzn3ws5op6q
      # No stored credentials: the ESO pod authenticates as the worker node's
      # OCI Instance Principal (dynamic group + policy, see runbook).
      principalType: InstancePrincipal
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thanes-lims-secrets
  namespace: thanes-lims
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault-thanes-lims
    kind: ClusterSecretStore
  target:
    # Same name/shape the Deployment already consumes via envFrom.secretRef -
    # ESO creates and owns this Secret.
    name: thanes-lims-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: thanes-lims-database-url }
    - secretKey: JWT_ACCESS_SECRET
      remoteRef: { key: thanes-lims-jwt-access-secret }
    - secretKey: JWT_REFRESH_SECRET
      remoteRef: { key: thanes-lims-jwt-refresh-secret }
    - secretKey: REDIS_URL
      remoteRef: { key: thanes-lims-redis-url }
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: { key: thanes-lims-anthropic-api-key }
    - secretKey: ORACLE_DSN
      remoteRef: { key: thanes-lims-oracle-dsn }
    # Object storage credentials (OCI IAM user Customer Secret Key) -
    # replaced MINIO_ACCESS_KEY / MINIO_SECRET_KEY.
    - secretKey: STORAGE_ACCESS_KEY
      remoteRef: { key: thanes-lims-storage-access-key }
    - secretKey: STORAGE_SECRET_KEY
      remoteRef: { key: thanes-lims-storage-secret-key }
