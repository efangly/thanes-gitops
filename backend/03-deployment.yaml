apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanes-lims-api
  namespace: thanes-lims
  labels:
    app: thanes-lims-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thanes-lims-api
  template:
    metadata:
      labels:
        app: thanes-lims-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: api
          # Bumped automatically by the backend repo's release.yml CI job
          # on every semver tag push. Don't edit the tag by hand.
          image: docker.io/siamatic/lims-backend:0.0.3
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: thanes-lims-config
            - secretRef:
                name: thanes-lims-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
