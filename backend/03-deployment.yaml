apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanes-lims-api
  namespace: thanes-lims
  labels:
    app: thanes-lims-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thanes-lims-api
  template:
    metadata:
      labels:
        app: thanes-lims-api
    spec:
      # Only needed if the Docker Hub repo is private. Create with:
      #   kubectl create secret docker-registry dockerhub-creds \
      #     --namespace thanes-lims \
      #     --docker-server=https://index.docker.io/v1/ \
      #     --docker-username=<user> --docker-password=<token>
      # Remove this section if the image is public.
      imagePullSecrets:
        - name: dockerhub-creds
      # Matches the fixed UID/GID the Dockerfile's USER directive runs
      # as, so kubelet can verify runAsNonRoot without inspecting the
      # image (avoids "cannot verify user is non-root" for images whose
      # USER is a name rather than a numeric UID).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: api
          # Bumped automatically by the backend repo's release.yml CI job
          # on every semver tag push. Don't edit the tag by hand.
          image: docker.io/siamatic/lims-backend:0.0.3
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: thanes-lims-config
            - secretRef:
                name: thanes-lims-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
