# Template only — no data here. Wallet files are binary and must never be
# committed to git. Create the real secret from a CONTAINER-READY copy of the
# unzipped ADB wallet directory, e.g.:
#   kubectl create secret generic adb-wallet -n thanes-lims \
#     --from-file=./wallet-container/
# or manage it with your secrets tooling (sealed-secrets, external-secrets, etc).
#
# IMPORTANT: do not point --from-file at the wallet directory you use for
# local dev. sqlnet.ora's WALLET_LOCATION is an absolute path baked in at
# wallet download time - if it still points at your dev machine's path
# (e.g. /Users/you/oracle/wallet), the pod mounts it at /app/wallet but
# godror/ODPI-C can't find the wallet cert there. It fails silently and
# retries per tnsnames.ora's retry_count/retry_delay (~60s+) before erroring,
# which looks exactly like a network hang but isn't one. Before creating the
# secret, copy the wallet and rewrite sqlnet.ora's DIRECTORY to "/app/wallet"
# (matching the Deployment's volumeMount path) in that copy only.
apiVersion: v1
kind: Secret
metadata:
  name: adb-wallet
  namespace: thanes-lims
  annotations:
    # Tracked in git as a template only — never let ArgoCD apply/overwrite
    # the real Secret with an empty payload.
    argocd.argoproj.io/sync-options: Skip=true
type: Opaque
