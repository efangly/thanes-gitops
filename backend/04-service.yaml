apiVersion: v1
kind: Service
metadata:
  name: thanes-lims-api
  namespace: thanes-lims
spec:
  type: ClusterIP
  selector:
    app: thanes-lims-api
  ports:
    - name: http
      port: 80
      targetPort: http
      # Pins the Envoy Gateway upstream protocol explicitly instead of
      # relying on its default - the backend (fasthttp) only ever speaks
      # HTTP/1.1, no h2c support exists in this service.
      appProtocol: kubernetes.io/h1.1
