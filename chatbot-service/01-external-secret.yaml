# Reuses the same ClusterSecretStore ../backend/06-external-secret.yaml
# defines (oci-vault-thanes-lims) - one OCI Vault backs every secret in
# this namespace, this just projects three of its existing/new keys into a
# second Secret object for this service. See ../backend/SECRETS-OCI-VAULT.md
# for the one-time Vault/IAM/ESO setup (already required by ../backend/,
# not repeated here) and ../backend/06-external-secret.yaml for the
# ClusterSecretStore definition itself - apply that (or ../backend/ as a
# whole) before this file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lims-chatbot-service-secrets
  namespace: thanes-lims
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oci-vault-thanes-lims
    kind: ClusterSecretStore
  target:
    name: lims-chatbot-service-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # MUST be the exact same value as the Go backend's own
    # JWT_ACCESS_SECRET (../backend/06-external-secret.yaml) - this service
    # verifies the SAME tokens the Go backend issues, HS256, shared secret.
    # Same vault key, both ExternalSecrets reference it independently.
    - secretKey: JWT_ACCESS_SECRET
      remoteRef: { key: thanes-lims-jwt-access-secret }
    # MUST be the exact same value ../mcp-server/ (via ../backend/'s
    # ExternalSecret) checks - same vault key, see
    # ../mcp-server/README.md "Before applying".
    - secretKey: MCP_SERVICE_API_KEY
      remoteRef: { key: thanes-lims-mcp-service-api-key }
    # Same Anthropic key the old Go chatbot POC used
    # (backend docs/chatbot-poc-plan.md) - reused here since the LLM calls
    # moved from Go to this service; ../backend/ no longer needs it once
    # Phase 2 (decommissioning the old chatbot) removes ANTHROPIC_API_KEY
    # from its own ExternalSecret.
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: { key: thanes-lims-anthropic-api-key }
