# Replace PLACEHOLDER_EMAIL with a real email (Let's Encrypt sends expiry/
# problem notices there). This is cluster-scoped (not namespaced) — apply once,
# it can be reused by any Certificate in the cluster.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ldv.rde@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: lims-gateway
                namespace: thanes-lims
