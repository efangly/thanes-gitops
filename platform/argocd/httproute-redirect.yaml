apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server-https-redirect
  namespace: argocd
spec:
  parentRefs:
    - name: lims-gateway
      namespace: thanes-lims
      sectionName: http
  hostnames:
    - argocd.siamatic.work
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
